                      <div className="absolute bottom-3 left-3 right-3 bg-emerald-950/90 border border-emerald-500 rounded-xl p-2.5 flex items-center gap-3">
                        <div className="w-8 h-8 rounded-lg bg-emerald-500 text-slate-950 flex items-center justify-center font-bold">✓</div>
                        <div className="text-xs">
                          <div className="font-black text-emerald-400">Presensi Berhasil!</div>
                          <div className="font-bold text-white">{scanSuccess.name}</div>
                          <div className="text-[10px] text-slate-300">{scanSuccess.time}</div>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* ========================================================================= */}
          {/* MODAL 2: KARTU IDENTITAS PESERTA DIDIK MATCHING IMAGE 1                   */}
          {/* ========================================================================= */}
          {isIDCardOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md">
              <div className="bg-[#0a192f] text-white w-full max-w-3xl rounded-3xl border border-slate-800 p-6 space-y-4">
                <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                  <h3 className="font-extrabold text-sm text-white">Kartu QR Siswa › Detail Kartu</h3>
                  <button onClick={() => setIsIDCardOpen(false)} className="text-slate-400 hover:text-white">✕</button>
                </div>
                <div className="grid grid-cols-1 md:grid-cols-12 gap-6 items-center">
                  <div className="md:col-span-4 space-y-3">
                    <label className="text-xs text-slate-400 block">Pilih Siswa</label>
                    <select
                      value={selectedStudent.id}
                      onChange={(e) => setSelectedStudent(mockStudents.find(s => s.id === e.target.value))}
                      className="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-xs text-white"
                    >
                      {mockStudents.map(s => <option key={s.id} value={s.id}>{s.name} ({s.nisn})</option>)}
                    </select>
                    <button onClick={() => window.print()} className="w-full py-2.5 bg-blue-600 rounded-xl font-bold text-xs text-white">🖨️ Cetak Kartu</button>
                    <button onClick={() => window.print()} className="w-full py-2.5 bg-slate-800 rounded-xl font-bold text-xs text-slate-200">📥 Download PDF</button>
                  </div>

                  {/* Physical ID Card Preview Matching Image 1 */}
                  <div className="md:col-span-8 flex justify-center">
                    <div className="w-full max-w-sm bg-gradient-to-br from-blue-950 via-[#0a192f] to-slate-950 rounded-2xl p-4 border-2 border-amber-400/50 shadow-2xl text-slate-900 bg-white">
                      <div className="bg-white rounded-xl p-3 border border-slate-200 space-y-2">
                        <div className="flex items-center gap-2 border-b-2 border-amber-400 pb-1.5">
                          <div className="w-8 h-8 rounded-full bg-blue-900 text-amber-400 font-bold flex items-center justify-center text-xs">SD</div>
                          <div>
                            <div className="font-extrabold text-xs text-blue-950">SDN SUMBEREJO 04</div>
                            <div className="text-[9px] text-slate-500">Kec. Ambulu • Jember</div>
                          </div>
                        </div>
                        <div className="text-center font-black text-[10px] text-blue-900 uppercase tracking-wider bg-blue-50 py-0.5 rounded">
                          KARTU IDENTITAS PESERTA DIDIK
                        </div>
                        <div className="flex items-center gap-3 pt-1">
                          <div className="w-16 h-20 bg-slate-200 rounded border flex items-center justify-center font-bold text-slate-500 text-xs">FOTO</div>
                          <div className="flex-1 text-[11px] space-y-0.5">
                            <div className="font-extrabold text-slate-900 text-xs">{selectedStudent.name}</div>
                            <div>NISN: <strong>{selectedStudent.nisn}</strong></div>
                            <div>NIS: {selectedStudent.nis}</div>
                            <div>Kelas: <strong className="text-blue-900">{selectedStudent.className}</strong></div>
                          </div>
                          <div className="w-16 h-16 bg-slate-900 text-white rounded p-1 text-[8px] flex items-center justify-center font-mono">
                            [QR TOKEN]
                          </div>
                        </div>
                        <div className="border-t pt-1 flex justify-between text-[8px] font-bold text-slate-500">
                          <span>TP 2026/2027</span>
                          <span className="text-blue-900">Berprestasi • Berkarakter • Berakhlak Mulia</span>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* ========================================================================= */}
          {/* MODAL 3: INPUT NILAI MATCHING IMAGE 1                                      */}
          {/* ========================================================================= */}
          {isGradeInputOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md">
              <div className="bg-[#0a192f] text-white w-full max-w-4xl rounded-3xl border border-slate-800 p-6 space-y-4">
                <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                  <h3 className="font-extrabold text-sm text-white">Penilaian › Input Nilai</h3>
                  <button onClick={() => setIsGradeInputOpen(false)} className="text-slate-400 hover:text-white">✕</button>
                </div>
                <div className="flex flex-wrap gap-2 items-center text-xs">
                  <span className="bg-slate-900 px-3 py-1.5 rounded-lg border border-slate-700">Kelas: VI A</span>
                  <span className="bg-slate-900 px-3 py-1.5 rounded-lg border border-slate-700">Mapel: Matematika</span>
                  <span className="bg-slate-900 px-3 py-1.5 rounded-lg border border-slate-700">Jenis: Ulangan Harian</span>
                  <button onClick={() => { alert("Nilai berhasil disimpan!"); setIsGradeInputOpen(false); }} className="ml-auto px-4 py-1.5 bg-blue-600 rounded-lg font-bold text-white">Simpan Nilai</button>
                </div>
                <div className="overflow-x-auto">
                  <table className="w-full text-left text-xs">
                    <thead className="bg-slate-900 text-slate-400 uppercase text-[10px]">
                      <tr><th className="p-2.5">No</th><th className="p-2.5">Nama Siswa</th><th className="p-2.5">NISN</th><th className="p-2.5">Nilai</th><th className="p-2.5">Keterangan</th></tr>
                    </thead>
                    <tbody className="divide-y divide-slate-800">
                      {mockStudents.map((s, i) => (
                        <tr key={s.id}>
                          <td className="p-2.5 text-slate-500">{i+1}</td>
                          <td className="p-2.5 font-bold text-white">{s.name}</td>
                          <td className="p-2.5 font-mono text-slate-400">{s.nisn}</td>
                          <td className="p-2.5"><input defaultValue={85 + i} className="w-16 bg-slate-900 border border-slate-700 rounded p-1 text-center font-bold text-white" /></td>
                          <td className="p-2.5 text-slate-400">-</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
